<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erişim Yasak | 403</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;0,6..96,700;1,6..96,400&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/assets/styles/main.css">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .error-content {
            max-width: 600px;
        }

        .error-code {
            font-family: 'Bodoni Moda', serif;
            font-size: 8rem;
            font-weight: 700;
            color: var(--c-accent);
            line-height: 1;
            margin-bottom: 1rem;
            letter-spacing: -4px;
        }

        .error-title {
            font-family: 'Bodoni Moda', serif;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            letter-spacing: -1px;
        }

        .error-message {
            color: var(--c-text-secondary);
            line-height: 1.7;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        .error-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-home {
            display: inline-block;
            padding: 0.875rem 2rem;
            background-color: var(--c-accent);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .btn-home:hover {
            background-color: var(--c-accent-hover);
        }
    </style>
</head>

<body class="theme-light">
    <div class="noise-overlay"></div>

    <div class="error-page">
        <div class="error-content">
            <div class="error-code">403</div>
            <h1 class="error-title">Erişim Yasak</h1>
            <p class="error-message">
                Bu sayfaya erişim izniniz bulunmuyor.
                Bu kaynak kısıtlı olabilir veya yetkiniz yok.
            </p>
            <div class="error-actions">
                <a href="/" class="btn-home">Ana Sayfaya Dön</a>
            </div>
        </div>
    </div>

</body>

</html>
